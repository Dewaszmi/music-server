<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library import</title>
</head>
<body>
  <main id="login-view" hidden>
    <h1>Sign in</h1>
    <p class="lede">Enter the access token to use the library import UI.</p>
    <form id="login-form">
      <input id="token" type="password" name="token" required placeholder="Access token" autocomplete="current-password">
      <button type="submit">Continue</button>
    </form>
    <p class="error" id="login-error" hidden></p>
  </main>
  <main id="app-view" hidden>
    <h1>Add to library</h1>
    <p class="lede">Same input as <code>import_youtube.py</code>: an album / track search, or a YouTube Music artist / Topic channel URL.</p>
    <form id="add-form">
      <input id="query" type="text" name="query" required placeholder="artist / album keywords, or a YouTube Music URL">
      <button type="submit">Add</button>
    </form>
    <div class="toolbar">
      <h2>Jobs</h2>
      <div>
        <button class="secondary" id="scan" type="button">Rescan library</button>
        <button class="secondary" id="logout" type="button">Sign out</button>
        <span class="scan-msg" id="scan-msg"></span>
      </div>
    </div>
    <div id="jobs" class="empty">No jobs yet.</div>
  </main>
  <script>
    const TOKEN_KEY = "webUiToken";
    const jobsEl = document.getElementById("jobs");
    const scanMsg = document.getElementById("scan-msg");
    const loginView = document.getElementById("login-view");
    const appView = document.getElementById("app-view");
    const loginError = document.getElementById("login-error");
    let events = null;

    function getToken() {
      return localStorage.getItem(TOKEN_KEY) || "";
    }

    function setToken(token) {
      if (token) {
        localStorage.setItem(TOKEN_KEY, token);
      } else {
        localStorage.removeItem(TOKEN_KEY);
      }
    }

    function authHeaders(extra = {}) {
      const headers = { ...extra };
      const token = getToken();
      if (token) {
        headers.Authorization = `Bearer ${token}`;
      }
      return headers;
    }

    function showLogin(message = "") {
      disconnectEvents();
      appView.hidden = true;
      loginView.hidden = false;
      loginError.hidden = !message;
      loginError.textContent = message;
    }

    function showApp() {
      loginView.hidden = true;
      appView.hidden = false;
      connectEvents();
    }

    function disconnectEvents() {
      if (events) {
        events.close();
        events = null;
      }
    }

    function connectEvents() {
      disconnectEvents();
      const token = getToken();
      const url = token ? `/api/events?token=${encodeURIComponent(token)}` : "/api/events";
      events = new EventSource(url);
      events.onmessage = (event) => {
        const data = JSON.parse(event.data);
        render(data.jobs || []);
      };
      events.onerror = () => {
        if (events.readyState === EventSource.CLOSED) {
          scanMsg.textContent = "Live updates disconnected";
        }
      };
    }

    async function checkAuth() {
      const res = await fetch("/api/jobs", { headers: authHeaders() });
      if (res.status === 401) {
        return getToken() ? "invalid" : "required";
      }
      if (!res.ok) {
        return "error";
      }
      const data = await res.json();
      render(data.jobs || []);
      return "ok";
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const urlToken = params.get("token");
      if (urlToken) {
        setToken(urlToken);
        params.delete("token");
        const next = `${window.location.pathname}${params.toString() ? `?${params}` : ""}`;
        window.history.replaceState({}, "", next);
      }

      const status = await checkAuth();
      if (status === "required") {
        showLogin();
        return;
      }
      if (status === "invalid") {
        setToken("");
        showLogin("Invalid or expired token.");
        return;
      }
      if (status === "error") {
        showLogin("Could not reach the server.");
        return;
      }
      showApp();
    }

    function pct(job) {
      if (!job.total) return job.status === "done" ? 100 : 0;
      return Math.round(((job.downloaded + job.failed) / job.total) * 100);
    }

    function render(jobs) {
      if (!jobs.length) {
        jobsEl.className = "empty";
        jobsEl.textContent = "No jobs yet.";
        return;
      }
      jobsEl.className = "";
      jobsEl.innerHTML = jobs.map((job) => {
        const counts = job.total
          ? `${job.downloaded} downloaded · ${job.failed} failed · ${job.total} total`
          : job.status;
        const artist = job.artist ? `${job.artist} · ` : "";
        return `<article class="job">
          <header>
            <div class="query">${escapeHtml(job.query)}</div>
            <div class="status ${job.status}">${job.status}</div>
          </header>
          <p class="meta">${escapeHtml(artist + counts)}</p>
          <div class="bar"><span style="width:${pct(job)}%"></span></div>
          ${job.current ? `<p class="current">${escapeHtml(job.current)}</p>` : ""}
          ${job.error ? `<p class="error">${escapeHtml(job.error)}</p>` : ""}
          ${job.log?.length ? `<pre class="log">${escapeHtml(job.log.join("\n"))}</pre>` : ""}
        </article>`;
      }).join("");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = document.getElementById("token");
      const token = input.value.trim();
      if (!token) return;
      setToken(token);
      loginError.hidden = true;
      const status = await checkAuth();
      if (status !== "ok") {
        setToken("");
        showLogin(status === "invalid" ? "Invalid token." : "Could not sign in.");
        return;
      }
      input.value = "";
      showApp();
    });

    document.getElementById("logout").addEventListener("click", () => {
      setToken("");
      showLogin();
    });

    document.getElementById("add-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = document.getElementById("query");
      const query = input.value.trim();
      if (!query) return;
      const res = await fetch("/api/jobs", {
        method: "POST",
        headers: authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({ query }),
      });
      if (res.status === 401) {
        setToken("");
        showLogin("Session expired. Sign in again.");
        return;
      }
      const data = await res.json();
      if (!res.ok) {
        alert(data.error || "Could not queue job");
        return;
      }
      input.value = "";
    });

    document.getElementById("scan").addEventListener("click", async () => {
      const button = document.getElementById("scan");
      button.disabled = true;
      scanMsg.textContent = "Scanning…";
      try {
        const res = await fetch("/api/scan", { method: "POST", headers: authHeaders() });
        if (res.status === 401) {
          setToken("");
          showLogin("Session expired. Sign in again.");
          return;
        }
        const data = await res.json();
        scanMsg.style.maxHeight = "none";
        scanMsg.style.overflow = "visible";
        scanMsg.textContent = res.ok ? (data.message || "Scan started") : (data.error || "Scan failed");
      } catch (err) {
        scanMsg.textContent = String(err);
      } finally {
        button.disabled = false;
      }
    });

    init();
  </script>
</body>
</html>
